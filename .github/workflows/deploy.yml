name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Triggered by other repos (e.g. ctrlzpodcast) when new content is published
  repository_dispatch:
    types: [rebuild]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
  BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      # Deliberately no .next/cache restore: fetches use `force-cache`, so a
      # restored cache would serve stale Beehiiv / podcast data.
      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn opennextjs-cloudflare build

      # Writes the prerendered pages into the Worker's static assets
      # (read by the static-assets incremental cache). Skipping this causes 500s.
      - name: Populate cache
        run: yarn opennextjs-cloudflare populateCache local

      - name: Deploy
        run: yarn wrangler deploy
