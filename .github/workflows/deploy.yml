name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Triggered by other repos (e.g. the podcast) when content changes:
  #   gh api repos/renyard/ctrlz-next/dispatches -f event_type=rebuild
  repository_dispatch:
    types: [rebuild]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
  BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: npx opennextjs-cloudflare build

      # Writes the prerendered pages into the Worker's static assets so they are
      # served from cache instead of being re-rendered on every request.
      - name: Populate cache
        run: npx opennextjs-cloudflare populateCache local

      # Production: main, manual runs and content rebuilds
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy

      # Pull requests: a named preview per branch
      - name: Preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_NAME: ${{ github.head_ref }}
          PREVIEW_MESSAGE: PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})
        run: npx wrangler preview --name "$PREVIEW_NAME" --message "$PREVIEW_MESSAGE"
